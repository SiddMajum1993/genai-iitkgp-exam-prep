  - assets/js/exam2-mock-3-data.js
  - assets/js/exam2-mock-4-data.js
  - assets/js/exam2-mock-5-data.js
  - assets/js/exam2-mock-6-data.js
  - assets/js/exam2-mock-7-data.js
  - assets/js/exam2-mock-8-data.js
  - assets/js/quiz.js
  - assets/js/quizzes/ch01-ft-decisions.js
  - assets/js/quizzes/ch02-ft-data-training.js
  - assets/js/quizzes/ch03-peft-adapters-prompts.js
  - assets/js/quizzes/ch04-lora-qlora.js
  - assets/js/quizzes/ch05-rlhf-dpo.js
  - assets/js/quizzes/ch06-revision-slm-guardrails.js
  - assets/js/quizzes/ch07-vlm-architectures.js
  - assets/js/quizzes/ch08-vlm-applications.js
  - assets/js/quizzes/ch09-multimodal-rag.js
  - assets/js/quizzes/ch10-rag-to-agents.js
  - assets/js/quizzes/ch11-multi-agent.js
  - assets/js/quizzes/ch12-langchain-langgraph.js
  - assets/js/quizzes/ch13-responsible-ai.js
  - assets/js/quizzes/formulas.js
  - assets/js/practice-quiz.js
  - assets/js/aura.js

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/siddmajum1993
      name: Connect with Siddhartha on LinkedIn
  generator: false

