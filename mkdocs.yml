site_name: GenAI & Agentic AI — Exam Prep
site_description: A learner-friendly study guide for the upGrad × IIT Kharagpur Certificate Course on Generative and Agentic AI. Deep learn-guides, compressed revision notes, mock exam, and cheat sheet.
site_author: Community contributors
site_url: https://genai-iitkgp-exam-prep.pages.dev/

repo_url: https://www.linkedin.com/in/siddmajum1993
repo_name: Find me on LinkedIn
edit_uri: ""

copyright: >
  Study materials © the contributors, released under CC BY 4.0.
  Lecture slides, sample paper, and course content © upGrad × IIT Kharagpur — not redistributed here.

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/linkedin
    edit: material/pencil
    view: material/eye

plugins:
  - search
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/css/aura.css
  - assets/css/quiz.css
  - assets/css/practice-quiz.css

extra_javascript:
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/js/mock-exam-1-data.js
  - assets/js/mock-exam-2-data.js
  - assets/js/mock-exam-3-data.js
  - assets/js/mock-exam-4-data.js
